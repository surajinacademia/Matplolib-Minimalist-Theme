[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimalist"
version = "3.0.0"
description = "A clean matplotlib style package for scientific figures"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Suraj Sahu"},
]
keywords = [
    "matplotlib",
    "plotting",
    "scientific",
    "visualization",
    "style",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.7.0",
    "numpy>=1.23.0",
    "scicomap>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.0,<27",
    "build>=1.2,<2",
    "pytest>=8.0,<10",
    "ruff>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/surajinacademia/Matplolib-Minimalist-Theme"
Repository = "https://github.com/surajinacademia/Matplolib-Minimalist-Theme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["minimalist*"]

[tool.setuptools.package-data]
minimalist = ["styles/*.mplstyle"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
